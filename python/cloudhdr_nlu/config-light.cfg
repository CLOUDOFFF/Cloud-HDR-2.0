# =============================================================================
# Cloud HDR NLU — лёгкая сборка
# =============================================================================
#
# Та же задача, что и в config.cfg, но с оглядкой на вес и скорость. Замер
# полной сборки показал, из чего складывались 121 МБ и 3,4 мс:
#
#     vocab          77 МБ   словарь лексем и 20 000 векторов
#     textcat        30 МБ   линейный мешок слов на 262 144 корзины
#     tok2vec        10 МБ
#     морфология      7 МБ   и 2 мс из 3,4 — почти две трети времени разбора
#
# Отсюда четыре решения, каждое со своей ценой:
#
#   1. Нейросетевая морфология убрана целиком. Леммы берутся напрямую из словаря
#      pymorphy3 (см. pipeline.LemmaNorm) — это поиск по словарю, а не сеть.
#      Теряется снятие омонимии по контексту; для команд это несущественно.
#   2. Векторы обрезаны до 8 000 самых частых. Корпус команд узкий, двадцать
#      тысяч слов ему не нужны, а словарь лексем ужимается вместе с ними.
#   3. Мешок слов в textcat уменьшен с 262 144 до 16 384 корзин. Различных
#      признаков в корпусе на порядок меньше, остальное место пустовало.
#   4. Ширина tok2vec снижена со 128 до 96.
#
# Что НЕ тронуто и почему: ансамбль в textcat (мешок слов + свёртка по векторам)
# и предобученные векторы. Именно они дают обобщение на незнакомые формулировки —
# ради него всё и затевалось. Экономить надо на размере, а не на понимании.
# =============================================================================

[paths]
train = null
dev = null
vectors = "ru_core_news_md"
init_tok2vec = null

[system]
seed = 20260808
gpu_allocator = null

[nlp]
lang = "ru"
pipeline = ["cloudhdr_lemma_norm","tok2vec","textcat","ner"]
batch_size = 256
disabled = []
before_creation = null
after_creation = null
after_pipeline_creation = null

[nlp.tokenizer]
@tokenizers = "spacy.Tokenizer.v1"

[nlp.vectors]
@vectors = "spacy.Vectors.v1"

# ------------------------------------------------------------- компоненты ---

[components]

[components.cloudhdr_lemma_norm]
factory = "cloudhdr_lemma_norm"
pymorphy = true

[components.tok2vec]
factory = "tok2vec"

[components.tok2vec.model]
@architectures = "spacy.Tok2Vec.v2"

[components.tok2vec.model.embed]
@architectures = "spacy.MultiHashEmbed.v2"
width = ${components.tok2vec.model.encode.width}
attrs = ["NORM","PREFIX","SUFFIX","SHAPE"]
rows = [3000,1500,1500,1500]
include_static_vectors = true

[components.tok2vec.model.encode]
@architectures = "spacy.MaxoutWindowEncoder.v2"
width = 96
depth = 4
window_size = 1
maxout_pieces = 3

[components.textcat]
factory = "textcat"
threshold = 0.5

[components.textcat.model]
@architectures = "spacy.TextCatEnsemble.v2"
nO = null

[components.textcat.model.tok2vec]
@architectures = "spacy.Tok2VecListener.v1"
width = ${components.tok2vec.model.encode.width}
upstream = "tok2vec"

[components.textcat.model.linear_model]
@architectures = "spacy.TextCatBOW.v3"
exclusive_classes = true
ngram_size = 1
no_output_layer = false
length = 16384
nO = null

[components.textcat.scorer]
@scorers = "spacy.textcat_scorer.v2"

[components.ner]
factory = "ner"
moves = null
update_with_oracle_cut_size = 100
incorrect_spans_key = null

[components.ner.model]
@architectures = "spacy.TransitionBasedParser.v2"
state_type = "ner"
extra_state_tokens = false
hidden_width = 64
maxout_pieces = 2
use_upper = true
nO = null

[components.ner.model.tok2vec]
@architectures = "spacy.Tok2VecListener.v1"
width = ${components.tok2vec.model.encode.width}
upstream = "tok2vec"

[components.ner.scorer]
@scorers = "spacy.ner_scorer.v1"

# ---------------------------------------------------------------- корпуса ---

[corpora]

[corpora.train]
@readers = "spacy.Corpus.v1"
path = ${paths.train}
max_length = 0
gold_preproc = false
limit = 0
augmenter = null

[corpora.dev]
@readers = "spacy.Corpus.v1"
path = ${paths.dev}
max_length = 0
gold_preproc = false
limit = 0
augmenter = null

# --------------------------------------------------------------- обучение ---

[training]
dev_corpus = "corpora.dev"
train_corpus = "corpora.train"
seed = ${system.seed}
gpu_allocator = ${system.gpu_allocator}
dropout = 0.15
accumulate_gradient = 1
patience = 3000
max_epochs = 12
max_steps = 0
eval_frequency = 300
frozen_components = []
annotating_components = ["cloudhdr_lemma_norm"]
before_to_disk = null
before_update = null

[training.optimizer]
@optimizers = "Adam.v1"
beta1 = 0.9
beta2 = 0.999
L2_is_weight_decay = true
L2 = 0.01
grad_clip = 1.0
use_averages = false
eps = 1e-08
learn_rate = 0.001

[training.batcher]
@batchers = "spacy.batch_by_words.v1"
discard_oversize = false
tolerance = 0.2
get_length = null

[training.batcher.size]
@schedules = "compounding.v1"
start = 100
stop = 1000
compound = 1.001
t = 0.0

[training.logger]
@loggers = "spacy.ConsoleLogger.v1"
progress_bar = false

[training.score_weights]
cats_score = 0.6
ents_f = 0.4
cats_macro_f = null
cats_micro_f = null
cats_macro_auc = null
cats_f_per_type = null
ents_p = null
ents_r = null
ents_per_type = null

[initialize]
vectors = ${paths.vectors}
init_tok2vec = ${paths.init_tok2vec}
vocab_data = null
lookups = null
before_init = null

# Обрезка векторов идёт ПОСЛЕ загрузки и ДО обучения: модель учится ровно на
# тех векторах, с которыми потом будет работать.
[initialize.after_init]
@callbacks = "cloudhdr_prune_vectors.v1"
rows = 8000

[initialize.tokenizer]

[initialize.components]

[pretraining]
