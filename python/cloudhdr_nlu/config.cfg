# =============================================================================
# Cloud HDR NLU — конфигурация обучения spaCy
# =============================================================================
#
# Пайплайн состоит из двух частей.
#
#   1. Морфология, взятая готовой из ru_core_news_md и замороженная:
#      morphologizer → attribute_ruler → lemmatizer (pymorphy3). Обучать её
#      заново было бы бессмысленно — она уже обучена на корпусе, которого у нас
#      нет, и ей нужна только возможность отработать перед нашими слоями.
#      replace_listeners вживляет в morphologizer его собственный tok2vec, иначе
#      он подключился бы слушателем к НАШЕМУ энкодеру и ломался бы по мере того,
#      как тот обучается.
#
#   2. Наша часть: tok2vec с предобученными векторами, textcat (намерение) и
#      ner (границы цели команды). Оба обучаемых компонента слушают ОДИН
#      энкодер: понимание «это команда открытия» и «вот что открыть» опирается
#      на одни и те же признаки, и раздельные энкодеры удвоили бы вычисления,
#      ничего не добавив.
#
# textcat собран ансамблем: линейный мешок слов ловит точные совпадения со
# словарём, свёртка поверх векторов обобщает на незнакомые формулировки. Голый
# мешок слов был бы повторением brain.js, ради замены которого всё и делается.
# =============================================================================

[paths]
train = null
dev = null
vectors = "ru_core_news_md"
init_tok2vec = null

[system]
seed = 20260808
gpu_allocator = null

[nlp]
lang = "ru"
pipeline = ["morphologizer","attribute_ruler","lemmatizer","cloudhdr_lemma_norm","tok2vec","textcat","ner"]
batch_size = 256
disabled = []
before_creation = null
after_creation = null
after_pipeline_creation = null

[nlp.tokenizer]
@tokenizers = "spacy.Tokenizer.v1"

[nlp.vectors]
@vectors = "spacy.Vectors.v1"

# ------------------------------------------------------------- компоненты ---

[components]

[components.morphologizer]
source = "ru_core_news_md"
replace_listeners = ["model.tok2vec"]

[components.attribute_ruler]
source = "ru_core_news_md"

[components.lemmatizer]
source = "ru_core_news_md"

[components.cloudhdr_lemma_norm]
factory = "cloudhdr_lemma_norm"

[components.tok2vec]
factory = "tok2vec"

[components.tok2vec.model]
@architectures = "spacy.Tok2Vec.v2"

[components.tok2vec.model.embed]
@architectures = "spacy.MultiHashEmbed.v2"
width = ${components.tok2vec.model.encode.width}
attrs = ["NORM","PREFIX","SUFFIX","SHAPE"]
rows = [5000,2500,2500,2500]
include_static_vectors = true

[components.tok2vec.model.encode]
@architectures = "spacy.MaxoutWindowEncoder.v2"
width = 128
depth = 4
window_size = 1
maxout_pieces = 3

[components.textcat]
factory = "textcat"
threshold = 0.5

[components.textcat.model]
@architectures = "spacy.TextCatEnsemble.v2"
nO = null

[components.textcat.model.tok2vec]
@architectures = "spacy.Tok2VecListener.v1"
width = ${components.tok2vec.model.encode.width}
upstream = "tok2vec"

[components.textcat.model.linear_model]
@architectures = "spacy.TextCatBOW.v3"
exclusive_classes = true
ngram_size = 1
no_output_layer = false
length = 262144
nO = null

[components.textcat.scorer]
@scorers = "spacy.textcat_scorer.v2"

[components.ner]
factory = "ner"
moves = null
update_with_oracle_cut_size = 100
incorrect_spans_key = null

[components.ner.model]
@architectures = "spacy.TransitionBasedParser.v2"
state_type = "ner"
extra_state_tokens = false
hidden_width = 64
maxout_pieces = 2
use_upper = true
nO = null

[components.ner.model.tok2vec]
@architectures = "spacy.Tok2VecListener.v1"
width = ${components.tok2vec.model.encode.width}
upstream = "tok2vec"

[components.ner.scorer]
@scorers = "spacy.ner_scorer.v1"

# ---------------------------------------------------------------- корпуса ---

[corpora]

[corpora.train]
@readers = "spacy.Corpus.v1"
path = ${paths.train}
max_length = 0
gold_preproc = false
limit = 0
augmenter = null

[corpora.dev]
@readers = "spacy.Corpus.v1"
path = ${paths.dev}
max_length = 0
gold_preproc = false
limit = 0
augmenter = null

# --------------------------------------------------------------- обучение ---

[training]
dev_corpus = "corpora.dev"
train_corpus = "corpora.train"
seed = ${system.seed}
gpu_allocator = ${system.gpu_allocator}
dropout = 0.15
accumulate_gradient = 1
patience = 3000
max_epochs = 12
max_steps = 0
eval_frequency = 300
before_to_disk = null
before_update = null

# Морфология обучению не подлежит, но отработать перед нашими слоями обязана:
# без неё лемм нет, а значит нет и NORM, на котором стоят все признаки.
frozen_components = ["morphologizer","attribute_ruler","lemmatizer"]
annotating_components = ["morphologizer","attribute_ruler","lemmatizer","cloudhdr_lemma_norm"]

[training.optimizer]
@optimizers = "Adam.v1"
beta1 = 0.9
beta2 = 0.999
L2_is_weight_decay = true
L2 = 0.01
grad_clip = 1.0
use_averages = false
eps = 1e-08
learn_rate = 0.001

[training.batcher]
@batchers = "spacy.batch_by_words.v1"
discard_oversize = false
tolerance = 0.2
get_length = null

[training.batcher.size]
@schedules = "compounding.v1"
start = 100
stop = 1000
compound = 1.001
t = 0.0

[training.logger]
@loggers = "spacy.ConsoleLogger.v1"
progress_bar = false

# Намерение важнее границ: ошибка в намерении отправляет пользователя не туда,
# ошибка в границах чаще всего чинится словарём при разборе ответа.
[training.score_weights]
cats_score = 0.6
ents_f = 0.4
cats_macro_f = null
cats_micro_f = null
cats_macro_auc = null
cats_f_per_type = null
ents_p = null
ents_r = null
ents_per_type = null

[initialize]
vectors = ${paths.vectors}
init_tok2vec = ${paths.init_tok2vec}
vocab_data = null
lookups = null
before_init = null
after_init = null

[initialize.tokenizer]

[initialize.components]

[pretraining]
